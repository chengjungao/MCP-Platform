server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript application/json image/svg+xml;

    # 前端路由是 history 模式：未命中静态文件的路径一律回 index.html，由 vue-router 接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容 hash 的资源可以长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 但 index.html 绝对不能缓存：否则发版后用户拿到的还是旧入口，白屏或加载到已删除的 chunk
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 同源反代控制面 API。用服务名 manager，依赖 compose 网络内的 DNS；
    # 单独跑这个镜像时需要把 proxy_pass 换成真实 Manager 地址
    location /api/ {
        proxy_pass         http://manager:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # 与 Manager 的 spring.servlet.multipart.max-request-size 保持一致（REG-01）：
        # 这里设小了，大文档会在 nginx 层就被 413 掉，用户看到的错误与后端诊断对不上
        client_max_body_size 20m;
    }
}
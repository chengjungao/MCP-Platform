server:
  port: ${MANAGER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: mcp-manager
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mcpbridge}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:admin}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    # 表结构由 Flyway 管理，Hibernate 只做校验，避免运行期偷偷改表
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      # Swagger 文档上限（REG-01）；300 接口文档通常 < 5MB
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  data:
    web:
      pageable:
        # 分页参数名统一为 page / size，page 从 0 开始；上限防止一次拉全表
        default-page-size: 20
        max-page-size: 200
        one-indexed-parameters: false
  task:
    execution:
      thread-name-prefix: parse-
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 200

mcp:
  manager:
    jwt:
      # 登录令牌签名密钥。生产必须注入高熵随机串；平台按 SHA-256 派生 HS256 密钥
      secret: ${MANAGER_JWT_SECRET:dev-only-jwt-secret-please-change-me}
      ttl: 8h
      issuer: mcp-manager
    crypto:
      # Auth-B 凭据字段级加密主密钥（SEC-01）。生产用环境变量或 KMS 注入，禁止入库/入仓
      key: ${MANAGER_CRYPTO_KEY:dev-only-crypto-key-please-change-me}
    executor:
      # 节点接入令牌（PUB-02）：Executor 注册与心跳时携带，Manager 侧只存 sha256
      bootstrap-token: ${EXECUTOR_BOOTSTRAP_TOKEN:dev-executor-bootstrap-token}
      heartbeat-interval: 10s
      # 失联判定：3 个心跳周期无上报标记 OFFLINE
      heartbeat-timeout-multiplier: 3
    default-path-prefix: mcp
    parse:
      max-document-bytes: 20971520
      # 是否把 $ref 全部展开（大文档可关闭以提速，代价是 schema 里保留 $ref）
      resolve-fully: true
      fetch-timeout: 10s
      # SSRF 防护：默认拒绝拉取回环/内网地址的文档；本地联调可临时置 true，生产必须为 false
      allow-private-networks: ${MANAGER_PARSE_ALLOW_PRIVATE_NETWORKS:false}
    bootstrap:
      # 首次启动写入内置角色、根部门与管理员账号（幂等，已存在则跳过）
      enabled: true
      root-department: 平台总部
      admin-username: admin
      admin-password: ${MANAGER_ADMIN_PASSWORD:admin123}
      # 默认共享集群：节点接入令牌沿用 executor.bootstrap-token，开箱即用
      cluster-name: ${EXECUTOR_CLUSTER_NAME:default}
      cluster-entrypoint: ${EXECUTOR_CLUSTER_ENTRYPOINT:http://localhost:9090}

management:
  endpoints:
    web:
      exposure:
        # 控制面不接 Prometheus 抓取（指标由 Executor 侧暴露），只开 health/info/metrics
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.mcpbridge: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
# SEC-02：日志默认脱敏，凭据与疑似 PII 由 LogSanitizer 处理，不入日志